[package]
name = "postdove-desktop"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
postdove = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.11"
tempfile = "3"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
